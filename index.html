<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro Fotográfico · Editor A4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --ink:#1d1d1f; --muted:#6e6e73; --soft:#86868b; --line:#d2d2d7; --hair:#e8e8ed;
    --blue:#0071e3; --blue-h:#0077ed; --red:#ff3b30; --radius:18px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;letter-spacing:-.01em}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

  /* Topbar */
  .topbar{position:sticky;top:0;z-index:60;height:60px;display:flex;align-items:center;gap:14px;padding:0 22px;
    background:rgba(255,255,255,.75);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
  .brand{display:flex;align-items:center;gap:11px}
  .logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#1d1d1f,#3a3a3c);display:grid;place-items:center}
  .logo-mark svg{width:19px;height:19px}
  .brand h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.02em}
  .brand p{margin:1px 0 0;font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .stats{font-size:13px;color:var(--muted)} .stats b{color:var(--ink);font-weight:600}
  .btn{border:0;border-radius:980px;padding:8px 17px;font-weight:500;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--blue);color:#fff} .btn-primary:hover{background:var(--blue-h)} .btn-primary:disabled{opacity:.45}
  .btn-ghost{background:rgba(0,0,0,.05)} .btn-ghost:hover{background:rgba(0,0,0,.09)}
  .btn-block{width:100%;justify-content:center;border-radius:11px;padding:10px}
  .btn-outline{background:#fff;border:1px solid var(--line)} .btn-outline:hover{border-color:var(--blue);color:var(--blue)}

  /* Layout */
  .app{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 60px)}
  .sidebar{overflow-y:auto;padding:18px 18px 60px;border-right:1px solid rgba(0,0,0,.06)}
  .stage{overflow:auto;padding:26px 24px 90px;background:#e8e8ed}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .card h2{font-size:17px;font-weight:600;margin:0 0 12px;letter-spacing:-.02em}
  .sub{font-size:12px;color:var(--soft);line-height:1.45;margin:8px 0 0}
  .seg-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500;margin:14px 0 6px}
  .seg-label:first-of-type{margin-top:0}
  .seg{display:flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px;gap:2px}
  .seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 4px;cursor:pointer;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
  .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg button:not(.on):hover{background:rgba(255,255,255,.5)}
  .shape{display:block;border:1.6px solid currentColor;border-radius:3px;opacity:.8}
  .shape.square{width:15px;height:15px}.shape.portrait{width:12px;height:16px}.shape.landscape{width:18px;height:13px}
  .stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row-btns.ins3{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .row-btns.ins3 .btn{padding:10px 2px;font-size:13px}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px;margin-top:10px;border-top:1px solid var(--hair)}
  .switch{position:relative;width:44px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch i{position:absolute;inset:0;background:#e9e9eb;border-radius:20px;transition:.2s;cursor:pointer}
  .switch i:before{content:"";position:absolute;width:22px;height:22px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
  .switch input:checked+i{background:#34c759} .switch input:checked+i:before{transform:translateX(18px)}
  .sel-empty{font-size:13px;color:var(--soft);line-height:1.5}
  .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--muted);background:#fff}
  .hint-list{margin:0;padding-left:16px;font-size:12px;color:var(--muted);line-height:1.6}

  /* Pages */
  .pages{display:flex;flex-direction:column;align-items:center;gap:26px}
  .page-wrap{position:relative;display:flex;flex-direction:column;gap:9px}
  .page-bar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .page-bar .pn{font-weight:600;color:var(--ink);margin-right:auto}
  .page-wrap.cur .pn{color:var(--blue)}
  .pb.on{background:var(--accent,#0071e3);color:#fff}
  #btnGridAll.on{border-color:var(--accent,#0071e3);color:var(--accent,#0071e3);background:rgba(0,113,227,.06)}
  .pb{border:0;background:rgba(255,255,255,.7);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:.15s}
  .pb:hover{background:#fff;color:var(--blue)} .pb.danger:hover{color:var(--red)}
  .pb svg{width:13px;height:13px}
  .page{position:relative;background:#fff;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06),0 18px 50px rgba(0,0,0,.12);border-radius:2px;transition:box-shadow .15s}
  .page.drag-src{overflow:visible}
  .page.drop-target{box-shadow:0 0 0 3px var(--blue),0 18px 50px rgba(0,0,0,.12)}
  .page.files-over{box-shadow:0 0 0 3px #34c759,0 18px 50px rgba(0,0,0,.12)}
  .margin-guide{position:absolute;border:1px dashed rgba(0,113,227,.13);pointer-events:none}
  .guide{position:absolute;background:#ff2d78;pointer-events:none;z-index:40}
  .guide.v{width:1px;top:0;bottom:0}.guide.h{height:1px;left:0;right:0}
  .stat{position:absolute;white-space:pre;line-height:1;pointer-events:none}

  /* Elementos */
  .el{position:absolute}
  .el.moving{z-index:50;opacity:.92;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25))}
  .el.sel{outline:2px solid var(--blue);outline-offset:2px;z-index:30}
  .tx:hover:not(.sel){outline:1px dashed rgba(0,113,227,.5);outline-offset:2px}
  .tx .lbl{position:absolute;white-space:nowrap;line-height:1;pointer-events:none}
  .tx textarea{position:absolute;border:0;outline:0;background:transparent;resize:none;overflow:hidden;padding:0;margin:0;display:block;white-space:pre-wrap;overflow-wrap:break-word}
  .tx textarea::placeholder{color:#b8b8bd}
  .grip{position:absolute;left:-30px;top:0;width:22px;height:22px;border-radius:7px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18);display:none;place-items:center;cursor:move;color:var(--muted)}
  .grip svg{width:13px;height:13px}
  .tx:hover .grip,.tx.sel .grip{display:grid}
  .note .grip{left:0;top:-27px}
  .note{min-height:4px;z-index:20}   /* caixa de texto (com a tarja) sempre acima das fotos */
  .note textarea{cursor:text;z-index:1}
  .note-band{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
  .note-band i{position:absolute;background:#fff;display:block}
  .tx.fixed{cursor:text}
  .tx.fixed.sel{outline:1px solid rgba(0,113,227,.45);outline-offset:3px}
  .rw{position:absolute;right:-7px;top:50%;width:10px;height:26px;margin-top:-13px;border-radius:6px;background:#fff;border:2px solid var(--blue);display:none;cursor:ew-resize}
  .tx.sel .rw{display:block}
  .fr{cursor:move;touch-action:none}
  .fr-in{position:absolute;inset:0;overflow:hidden;background-position:center;background-repeat:no-repeat}
  .fr-empty{position:absolute;inset:0;border:1.5px dashed #c7c7cc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#a1a1a6;font-size:11.5px;text-align:center;padding:6px;transition:.15s;cursor:pointer}
  .fr-empty svg{width:26px;height:26px}
  .fr-empty small{font-size:10px;color:#c0c0c5}
  .fr:hover .fr-empty{border-color:var(--blue);color:var(--blue);background:rgba(0,113,227,.04)}
  .fr.files-over .fr-in,.fr.files-over .fr-empty{box-shadow:inset 0 0 0 3px #34c759}
  .ftb{position:absolute;top:6px;right:6px;display:none;gap:3px;background:rgba(29,29,31,.78);backdrop-filter:blur(10px);border-radius:10px;padding:3px;z-index:5}
  .fr:hover .ftb,.fr.sel .ftb{display:flex}
  .ftb button{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center}
  .ftb button:hover{background:rgba(255,255,255,.18)}
  .ftb button svg{width:14px;height:14px}
  .rh{position:absolute;right:-7px;bottom:-7px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--blue);display:none;cursor:nwse-resize;z-index:6}
  .fr:hover .rh,.fr.sel .rh{display:block}
  .sh{position:absolute;background:#fff;border:2px solid var(--blue);border-radius:6px;display:none;z-index:6}
  .sh.e,.sh.w{top:50%;width:10px;height:28px;margin-top:-14px;cursor:ew-resize}
  .sh.e{right:-6px}.sh.w{left:-6px}
  .sh.s,.sh.n{left:50%;height:10px;width:28px;margin-left:-14px;cursor:ns-resize}
  .sh.s{bottom:-6px}.sh.n{top:-6px}
  .fr.sel .sh{display:block}
  .fr.crop .sh,.fr.crop .rh{display:none!important}
  .dim-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-top:6px}
  .dim-grid label{font-size:12.5px;color:var(--muted)}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
  .stepper button{width:34px;height:32px;border:0;background:transparent;font-size:16px;cursor:pointer;color:var(--ink)}
  .stepper button:hover{background:rgba(0,0,0,.05)}
  .stepper input{flex:1;min-width:0;width:100%;border:0;text-align:center;font:inherit;font-size:13px;height:32px;outline:0;-moz-appearance:textfield}
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
  .stepper span{font-size:11px;color:var(--muted);padding-right:8px}
  .size-tag{position:absolute;left:0;bottom:-22px;font-size:10.5px;background:var(--blue);color:#fff;border-radius:5px;padding:2px 6px;white-space:nowrap;display:none}
  .el.moving .size-tag,.el.resizing .size-tag{display:block}

  /* Proporções e ajuste da foto */
  .seg.wrap{display:grid;grid-template-columns:repeat(3,1fr)}
  .seg.wrap5{display:grid;grid-template-columns:repeat(3,1fr)}
  .seg button:disabled{opacity:.35;cursor:default}
  .ratio-ic{display:block;border:1.6px solid currentColor;border-radius:2.5px;opacity:.8}
  .ph-img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .ghost{opacity:.32;z-index:0}
  .fr .fr-in{z-index:1}
  .el.crop{z-index:45;cursor:grab;outline:2px solid #ff9f0a;outline-offset:2px}
  .el.crop:active{cursor:grabbing}
  .el.crop .rh{display:none!important}
  .crop-hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:rgba(29,29,31,.78);color:#fff;font-size:11px;border-radius:8px;padding:4px 8px;white-space:nowrap;z-index:6;pointer-events:none;font-family:var(--font)}
  .ftb button.txt{width:auto;padding:0 8px;font-size:11.5px;font-weight:600;font-family:var(--font)}
  .rmenu{position:fixed;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;display:grid;grid-template-columns:repeat(2,max-content);gap:2px 4px;z-index:200;font-family:var(--font)}
  .rmenu button{all:unset;cursor:pointer;border-radius:8px;padding:7px 12px 7px 9px;font-size:12px;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px}
  .rmenu button:hover{background:var(--bg)} .rmenu button.on{background:rgba(0,113,227,.1);color:var(--blue);font-weight:600}
  .rmenu .ratio-ic{flex:none}
  .range-row{display:flex;align-items:center;gap:10px;margin-top:4px}
  .range-row input{flex:1;accent-color:var(--blue)}
  .range-row span{font-size:12px;color:var(--muted);width:42px;text-align:right;font-variant-numeric:tabular-nums}

  .overlay{position:fixed;inset:0;background:rgba(245,245,247,.7);backdrop-filter:blur(14px);display:none;place-items:center;z-index:100}
  .overlay.show{display:grid}
  .ov-card{background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:26px 32px;width:320px;text-align:center}
  .ov-card b{display:block;font-size:17px;margin-bottom:4px} .ov-card span{font-size:13px;color:var(--muted)}
  .bar{height:6px;background:var(--hair);border-radius:6px;margin-top:16px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:rgba(29,29,31,.92);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:120}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.sidebar{overflow:visible}.stage{overflow:visible}.stats,.brand p{display:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="11" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="17" width="7.5" height="4" rx="1.4"/></svg></div>
    <div><h1>Registro Fotográfico</h1><p>Edite direto na página · A4</p></div>
  </div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
  <button class="btn btn-ghost" id="btnNew">Novo</button>
  <button class="btn btn-primary" id="btnPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Gerar PDF</button>
</header>

<main class="app">
  <aside class="sidebar">
    <section class="card">
      <h2>Inserir</h2>
      <div class="stack" style="margin-top:0">
        <button class="btn btn-primary btn-block" id="btnPhotos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/></svg>Adicionar fotos</button>
        <div class="row-btns ins3">
          <button class="btn btn-outline btn-block" id="btnFrame">+ Quadro</button>
          <button class="btn btn-outline btn-block" id="btnText">+ Texto</button>
          <button class="btn btn-outline btn-block" id="btnPage">+ Página</button>
        </div>
      </div>
      <p class="sub">Você também pode arrastar fotos direto para um quadro ou para a página. As que sobrarem criam páginas novas.</p>
    </section>
    <section class="card" id="selCard" style="display:none">
      <h2>Seleção</h2>
      <div id="selBody"></div>
    </section>

    <section class="card">
      <h2>Grade de fotos</h2>
      <div class="seg-label"><span>Formato</span></div>
      <div class="seg" data-key="format" id="gridFormats"></div>
      <div class="seg-label"><span>Colunas</span><span id="capInfo"></span></div>
      <div class="seg" data-key="cols"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button></div>
      <div class="stack">
        <button class="btn btn-outline btn-block" id="btnGridAll">Aplicar grade</button>
        <button class="btn btn-outline btn-block" id="btnReset" style="color:var(--red)" title="Apaga textos, fotos e layout e começa um relatório em branco">Recomeçar do zero</button>
      </div>
    </section>
  </aside>

  <section class="stage" id="stage"><div class="pages" id="pages"></div></section>
</main>

<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div class="overlay" id="overlay"><div class="ov-card"><b id="ovTitle">Gerando PDF</b><span id="ovText">Preparando…</span><div class="bar"><i id="ovBar"></i></div></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
/* ====================== Constantes ====================== */
const PAGE_W = 210, PAGE_H = 297, M = 14, CW = PAGE_W - 2 * M, PT = 0.3528, GAP = 5;
const GRID_BOTTOM = PAGE_H - M;
const MAX_TITLE_LINES = 2;   // margens iguais nos quatro lados
const FOOT_Y = PAGE_H - M / 2 + 1; // linha de base do rodapé (dentro da margem inferior)
/* Proporções (largura:altura). "orig" = proporção original da foto */
const PRESETS = ['1:1', '3:4', '4:3', '2:3', '3:2', '9:16', '16:9'];
const ALL_FORMATS = ['orig', ...PRESETS, 'livre'];
const GRID_FORMATS = ['1:1', '3:4', '2:3', '9:16'];
const LEGACY = { square: '1:1', portrait: '3:4', landscape: '4:3' };
const parseR = f => { const [a, b] = f.split(':').map(Number); return a / b; };
function fmtName(f) {
  if (f === 'auto') return 'Automático';
  if (f === 'orig') return 'Original';
  if (f === 'livre') return 'Personalizado';
  const r = parseR(f); return `${f} · ${r === 1 ? 'Quadrado' : r < 1 ? 'Retrato' : 'Paisagem'}`;
}
function ratioIcon(f, size = 16) {
  if (f === 'livre') return `<svg class="ratio-ic" style="border:0;width:${size}px;height:${size}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="2" stroke-dasharray="3 2.2"/><path d="M15 12h4M17 10l2 2-2 2"/></svg>`;
  let r = f === 'orig' || f === 'auto' ? null : parseR(f);
  if (!r) return `<svg class="ratio-ic" style="border:0;width:${size}px;height:${size}px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${f === 'auto' ? '<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><path d="M12 8v8M8 12h8"/>' : '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>'}</svg>`;
  const w = r >= 1 ? size : size * r, h = r >= 1 ? size / r : size;
  return `<i class="ratio-ic" style="width:${w.toFixed(1)}px;height:${h.toFixed(1)}px"></i>`;
}
function elRatio(el) {
  if (el.format === 'orig') { const p = el.photo && photos[el.photo]; return p && p.w ? p.w / p.h : 1; }
  if (el.format === 'livre') return el.w / el.h;
  return parseR(el.format);
}
const gridRatio = () => S.format === 'auto' ? 1 : parseR(S.format);
function nearestPreset(r) {
  let best = '1:1', bd = Infinity;
  PRESETS.forEach(f => { const d = Math.abs(Math.log(parseR(f) / r)); if (d < bd) { bd = d; best = f; } });
  return best;
}
/* Encaixa o quadro dentro de uma caixa mantendo a proporção, centralizado */
function fitInto(el, box, r) {
  let w = box.w, h = w / r; if (h > box.h) { h = box.h; w = h * r; }
  el.w = w; el.h = h; el.x = box.x + (box.w - w) / 2; el.y = box.y + (box.h - h) / 2;
}
/* Mantém o quadro dentro das margens (superior, inferior, esquerda e direita) */
/* Limite superior dos quadros da página = logo abaixo do título */
function pageTop(pi) { return S.pages[pi] ? contentTop(pi) : M; }
function clampToPage(el, top) {
  if (top == null) { const loc = findEl(el.id); top = loc ? pageTop(loc.pi) : M; }
  const maxH = GRID_BOTTOM - top;
  if (el.w > CW) { const s = CW / el.w; el.w *= s; el.h *= s; }
  if (el.h > maxH) { const s = maxH / el.h; el.w *= s; el.h *= s; }

          const fs = sp.size * PT;

}

  // migração de versões anteriores
  S.theme = 'apple'; S.quality = 'std';
  // sem protocolo e sem descrição; título fixo no topo; quadros dentro das margens
  S.fields = { equipamento: (S.fields && S.fields.equipamento) || '' };
  S.fields.equipamento = limitTitle(S.fields.equipamento);
  const hadDesc = new Set();
  [...S.pages, ...(S.gridAllUndo || [])].forEach(p => [p.els, p.preGrid].forEach(arr => {
    if (!arr) return;
    for (let i = arr.length - 1; i >= 0; i--) if (arr[i].type === 'text' && (arr[i].field === 'protocolo' || arr[i].field === 'descricao')) {
      if (arr[i].field === 'descricao' && arr === p.els) hadDesc.add(p.id);
      arr.splice(i, 1);
    }
    const eq = arr.find(e => e.type === 'text' && e.field === 'equipamento');
    if (eq) { eq.h = textLayout(eq).h; Object.assign(eq, { x: M, y: M, w: CW }); }
    arr.forEach(e => { if (e.type === 'image') clampToPage(e, M); });
  }));
  // proporção da grade fixa em 3:4; encaixe magnético e guias de margem sempre ativos
  if (!GRID_FORMATS.includes(S.format)) S.format = '3:4';
  S.snap = true; S.margins = true;
  $('#gridFormats').innerHTML = GRID_FORMATS.map(f => `<button data-v="${f}">${ratioIcon(f, 15)}${f}</button>`).join('');
  S.pages.forEach(p => p.els.forEach(e => { if (e.photo && !photos[e.photo]) e.photo = null; }));
  S.pages.forEach(p => p.els.forEach(e => { if (e.type !== 'image') return; if (LEGACY[e.format]) e.format = LEGACY[e.format]; if (!ALL_FORMATS.includes(e.format)) e.format = '1:1'; e.zoom = e.zoom || 1; e.fx = e.fx ?? .5; e.fy = e.fy ?? .5; }));
  // versões anteriores: os quadros passam a começar logo abaixo do título
  let leftover = [];
  if ((S.ver || 0) < 12) S.pages.forEach((p, pi) => {
    const imgs = p.els.filter(e => e.type === 'image');
    if (!imgs.length) return;
    if (imgs.every(e => e.box)) { leftover = leftover.concat(buildGrid(pi, imgs.sort(readingOrder).map(e => e.photo).filter(Boolean))); return; }
    const top = pageTop(pi), shift = top - Math.min(...imgs.map(e => e.y));
    imgs.forEach(e => { e.y += shift; e.box = null; clampToPage(e, top); });
  });
  S.ver = 12;
  while (leftover.length) { S.pages.push(newPage()); leftover = buildGrid(S.pages.length - 1, leftover); }
  gcPhotos(); syncControls(); renderAll();
  // fechar menu de proporções / sair do modo ajuste ao clicar fora
  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.rmenu') && !e.target.closest('[data-a=ratio]')) document.querySelectorAll('.rmenu').forEach(m => m.remove());
    if (cropId && !e.target.closest(`[data-el="${cropId}"]`) && !e.target.closest('#selCard')) exitCrop();
  }, true);

  document.querySelectorAll('.sidebar > section .seg[data-key]').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const k = seg.dataset.key;
    S[k] = k === 'cols' ? +b.dataset.v : b.dataset.v; syncControls();
    if (k === 'theme') MD = MD; // métricas mudam com a fonte; renderAll recalcula
    renderAll();
  }));
  document.querySelectorAll('[data-t]').forEach(i => i.addEventListener('change', () => { S[i.dataset.t] = i.checked; renderAll(); }));
  $('#btnGridAll').onclick = () => {
    if (S.gridAllUndo) {
      S.pages = S.gridAllUndo.map(p => ({ ...p, els: p.els.map(e => (e.photo && !photos[e.photo] ? { ...e, photo: null } : e)) }));
      delete S.gridAllUndo; curPage = 0; gcPhotos(); renderAll(); syncControls(); toast('Grade desaplicada'); return;
    }
    S.gridAllUndo = clone(S.pages);
    const list = allFrames().map(o => o.el.photo).filter(Boolean);
    const keep = S.pages.filter(p => p.els.some(e => e.type === 'text' || e.type === 'note'));
    S.pages = keep.length ? keep : [newPage()];
    let rest = list;
    S.pages.forEach((p, pi) => { rest = buildGrid(pi, rest); });
    while (rest.length) { S.pages.push(newPage()); rest = buildGrid(S.pages.length - 1, rest); }
    S.pages.forEach(p => { delete p.preGrid; delete p.gridOf; });
    curPage = 0; syncControls(); renderAll(); toast('Grade aplicada');
  };
  $('#btnPhotos').onclick = () => { pendingFrame = null; $('#fileInput').click(); };
  $('#btnFrame').onclick = () => addFrame(curPage);
  $('#btnText').onclick = () => addNote(curPage);
  $('#btnPage').onclick = () => { S.pages.splice(curPage + 1, 0, newPage()); buildGrid(curPage + 1, []); curPage++; renderAll(); document.querySelectorAll('.page-wrap')[curPage].scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  // "Adicionar fotos" preenche a partir da página 1 até lotá-la; o excedente segue para as próximas / novas páginas
  $('#fileInput').addEventListener('change', e => { const files = [...e.target.files]; e.target.value = ''; if (files.length) placePhotos(files, pendingFrame, pendingFrame ? null : 0); pendingFrame = null; });
  $('#btnPdf').onclick = generatePDF;
  const resetAll = async () => {
    if (!confirm('Recomeçar do zero? Textos, fotos e layout atuais serão apagados.')) return;
    delete S.gridAllUndo; S.fields = { equipamento: '' }; Object.keys(photos).forEach(k => delete photos[k]); await DB.clear();
    sel = null; cropId = null; curPage = 0; defaultDoc(); syncControls(); renderAll();
    $('#stage').scrollTop = 0; toast('Relatório reiniciado');
  };
  $('#btnNew').onclick = resetAll;
  $('#btnReset').onclick = resetAll;
  window.addEventListener('dragover', e => { if (isFileDrag(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (isFileDrag(e)) e.preventDefault(); });
  document.addEventListener('paste', e => {
    if (document.activeElement && document.activeElement.tagName === 'TEXTAREA' && ![...(e.clipboardData?.items || [])].some(i => i.kind === 'file')) return;
    const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean);
    if (files.length) { e.preventDefault(); const f = sel && findEl(sel); placePhotos(files, f && f.el.type === 'image' ? f.el.id : null, curPage); }
  });
  document.addEventListener('keydown', e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'TEXTAREA' || tag === 'INPUT' || !sel) return;
    if (e.key === 'Escape' && exitCrop()) return;
    const f = findEl(sel); if (!f) return;
    const st = e.shiftKey ? 5 : 1, el = f.el;
    if (e.key === 'Delete' || e.key === 'Backspace') { if (el.type === 'image') { e.preventDefault(); frameAction('trash', el); } if (el.type === 'note') { e.preventDefault(); S.pages[f.pi].els = S.pages[f.pi].els.filter(x => x.id !== el.id); sel = null; renderAll(); } return; }
    if (e.key === 'Escape') return select(null);
    const mv = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key];
    if (mv && el.type === 'text') return;
    if (mv) { e.preventDefault(); el.x += mv[0]; el.y += mv[1]; clampToPage(el); if (el.box) el.box = null; renderAll(); }
  });
  let rt, lastW = $('#stage').clientWidth;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const w = $('#stage').clientWidth; if (w === lastW) return; lastW = w; renderAll(); }, 120); });
  $('#stage').addEventListener('scroll', closeMenus, { passive: true }); window.addEventListener('scroll', closeMenus, { passive: true });
  if (!hasPDF()) { const t = setInterval(() => { if (hasPDF()) { clearInterval(t); renderAll(); } }, 300); setTimeout(() => clearInterval(t), 15000); }
}
document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
